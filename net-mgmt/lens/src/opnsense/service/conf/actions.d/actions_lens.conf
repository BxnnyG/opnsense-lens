[observe]
command:/usr/local/opnsense/scripts/lens/collect.py observe
parameters:
type:script
message:record which devices hold which addresses

[harvest]
command:/usr/local/opnsense/scripts/lens/collect.py harvest
parameters:
type:script
message:copy hourly per-device traffic out of netflow before it expires

[prune]
command:/usr/local/opnsense/scripts/lens/collect.py prune
parameters:
type:script
message:apply the Lens retention setting

[status]
command:/usr/local/opnsense/scripts/lens/collect.py status
parameters:
errors:no
type:script_output
message:report what the Lens store holds

[purge]
command:/usr/local/opnsense/scripts/lens/collect.py purge
parameters:
type:script
message:delete everything Lens has collected
allowed_groups:wheel

[devices]
command:/usr/local/opnsense/scripts/lens/collect.py devices
parameters:
errors:no
type:script_output
message:list the devices Lens has observed

[traffic]
command:/usr/local/opnsense/scripts/lens/collect.py traffic --hours
parameters:%s
errors:no
type:script_output
message:report traffic joined onto devices for the last %s hours

[label]
command:/usr/local/opnsense/scripts/lens/collect.py label --mac
parameters:%s --fields %s
type:script_output
message:store the operator's own name for one device

[device]
command:/usr/local/opnsense/scripts/lens/collect.py device --mac
parameters:%s --hours %s
errors:no
type:script_output
message:report one device's hourly history

[identity]
command:/usr/local/opnsense/scripts/lens/collect.py identity
parameters:
errors:no
type:script_output
message:report whether MAC-keyed identity is holding

[segments]
command:/usr/local/opnsense/scripts/lens/collect.py segments --hours
parameters:%s
errors:no
type:script_output
message:report traffic per interface

[moment]
command:/usr/local/opnsense/scripts/lens/collect.py moment --mac
parameters:%s --at %s --step %s
errors:no
type:script_output
message:report what one device's traffic in one slice was made of

[baseline]
command:/usr/local/opnsense/scripts/lens/collect.py baseline
parameters:
errors:no
type:script_output
message:report which devices are unusual today

[timeline]
command:/usr/local/opnsense/scripts/lens/collect.py timeline --hours
parameters:%s
errors:no
type:script_output
message:report traffic on your own segments over time

[presence]
command:/usr/local/opnsense/scripts/lens/collect.py presence --hours
parameters:%s
errors:no
type:script_output
message:report when each device was here

[profile]
command:/usr/local/opnsense/scripts/lens/collect.py profile --mac
parameters:%s
errors:no
type:script_output
message:report one device's week and address history

[heatmap]
command:/usr/local/opnsense/scripts/lens/collect.py heatmap
parameters:
errors:no
type:script_output
message:report the network's week as a heatmap

[gateways]
command:/usr/local/opnsense/scripts/lens/collect.py gateways --hours
parameters:%s
errors:no
type:script_output
message:report gateway latency and loss over time

[internet]
command:/usr/local/opnsense/scripts/lens/collect.py internet --hours
parameters:%s
errors:no
type:script_output
message:report round trips to public resolvers and internet uptime

[settings]
command:/usr/local/opnsense/scripts/lens/collect.py settings
parameters:
errors:no
type:script_output
message:report the Lens settings with their defaults and bounds

[configure]
command:/usr/local/opnsense/scripts/lens/collect.py configure --fields
parameters:%s
type:script_output
message:store the operator's Lens settings

[destinations]
command:/usr/local/opnsense/scripts/lens/collect.py destinations --mac
parameters:%s --days %s
errors:no
type:script_output
message:report who one device talked to, per destination and port

[events]
command:/usr/local/opnsense/scripts/lens/collect.py events --days
parameters:%s
errors:no
type:script_output
message:report what happened over the last %s days

# dotted, so both hang off one "dns" node: configd builds a tree from the dots
# and refuses [dns] beside [dns.device] as an overlay (processhandler.py)
[dns.overview]
command:/usr/local/opnsense/scripts/lens/collect.py dns --hours
parameters:%s
errors:no
type:script_output
message:report what the network looked up, per device

[dns.device]
command:/usr/local/opnsense/scripts/lens/collect.py dns-device --mac
parameters:%s --hours %s
errors:no
type:script_output
message:report what one device looked up

[forget.device]
command:/usr/local/opnsense/scripts/lens/collect.py forget --mac
parameters:%s
type:script_output
message:delete everything Lens holds about one device
allowed_groups:wheel

[forget.preview]
command:/usr/local/opnsense/scripts/lens/collect.py forget --dry --mac
parameters:%s
errors:no
type:script_output
message:count what forgetting one device would delete

[kept]
command:/usr/local/opnsense/scripts/lens/collect.py kept
parameters:
errors:no
type:script_output
message:report what Lens keeps about the devices on the network

[unexplained]
command:/usr/local/opnsense/scripts/lens/collect.py unexplained --hours
parameters:%s
errors:no
type:script_output
message:list the addresses behind unattributed traffic

# Pausing a device (§4.74). The alias and the rule are written by PHP through
# core's models; these keep Lens's own record of since and until when.
[pause.start]
command:/usr/local/opnsense/scripts/lens/collect.py pause-start --mac
parameters:%s --macs %s --until %s
type:script_output
message:remember that a device was paused
allowed_groups:wheel

[pause.end]
command:/usr/local/opnsense/scripts/lens/collect.py pause-end --mac
parameters:%s --how %s
type:script_output
message:remember that a pause ended
allowed_groups:wheel

[pauses]
command:/usr/local/opnsense/scripts/lens/collect.py pauses
parameters:
errors:no
type:script_output
message:report which devices are paused, and which were
