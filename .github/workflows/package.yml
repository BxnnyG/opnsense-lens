# os-lens built on FreeBSD, a signed pkg repository around it, and -- on a
# version tag or when asked -- that repository published on GitHub Pages
# (stages 40 and 43, §4.68).
#
# Signing uses the secret LENS_PKG_KEY (an RSA private key, PEM). Its public
# half is tools/feed/lens.pub in this repository; the run refuses to publish a
# feed signed with any other key, and proves the feed verifies with pkg itself
# before it goes anywhere. Runs on demand and on a tag, never on every push: a
# FreeBSD VM costs minutes.

name: package

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'build os-lens rather than os-lens-devel'
        type: boolean
        default: false
      publish:
        description: 'publish the signed feed on GitHub Pages (implies release)'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release || inputs.publish }}
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # the key reaches the VM as a file in the workspace and is removed there;
      # the artifact below is feed/ only, so it can never be uploaded
      - name: hand the signing key to the build
        if: env.SIGN == 'true'
        env:
          LENS_PKG_KEY: ${{ secrets.LENS_PKG_KEY }}
        run: |
          if [ -z "$LENS_PKG_KEY" ]; then
            echo "::error::secret LENS_PKG_KEY is not set: nothing to sign the feed with (docs/plans/stage-43-publish.md)"
            exit 1
          fi
          if [ ! -s tools/feed/lens.pub ]; then
            echo "::error::tools/feed/lens.pub is missing: the public half must be in the repository before a feed is published"
            exit 1
          fi
          umask 077
          printf '%s\n' "$LENS_PKG_KEY" > signing.key

      - name: make package on FreeBSD, pkg repo, and verify it with pkg
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          envs: 'RELEASE SIGN'
          prepare: |
            pkg install -y git
          run: |
            set -e
            git config --global --add safe.directory "$(pwd)"
            cd net-mgmt/lens
            # Lens ships scripts, no binaries: any FreeBSD ABI may install it.
            # Mk/devel.mk names every build os-lens-devel, as `make package`
            # on the box does; a release builds os-lens (§4.68)
            if [ "$RELEASE" = "true" ]; then
              make package PLUGIN_NO_ABI=yes PLUGIN_DEVEL=
            else
              make package PLUGIN_NO_ABI=yes
            fi
            cd ../..
            mkdir -p feed/All
            cp net-mgmt/lens/work/pkg/*.pkg feed/All/
            if [ "$SIGN" = "true" ]; then
              openssl rsa -in signing.key -pubout -out /tmp/derived.pub 2> /dev/null
              if ! cmp -s /tmp/derived.pub tools/feed/lens.pub; then
                rm -f signing.key
                echo "LENS_PKG_KEY is not the key tools/feed/lens.pub belongs to" >&2
                exit 1
              fi
              pkg repo feed signing.key
              rm -f signing.key
              # the proof: pkg itself, with only the public key from the
              # repository, accepts the feed and finds the package in it
              mkdir -p /tmp/repos
              printf 'LensTest: { url: "file://%s/feed", signature_type: "pubkey", pubkey: "%s/tools/feed/lens.pub", enabled: yes }\n' \
                "$(pwd)" "$(pwd)" > /tmp/repos/LensTest.conf
              pkg -R /tmp/repos update -f -r LensTest
              pkg -R /tmp/repos rquery -r LensTest '%n %v'
            else
              pkg repo feed
            fi
            pkg info -F feed/All/*.pkg | head -12
            ls -lR feed

      - name: the key is gone
        if: always()
        run: rm -f signing.key

      - uses: actions/upload-artifact@v4
        with:
          name: os-lens-feed
          path: feed/
          if-no-files-found: error

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: os-lens-feed
          path: site/feed
      - name: the page around the feed
        run: |
          cp tools/feed/lens.pub site/lens.pub
          cp tools/install.sh site/install.sh
          cp tools/feed/index.html site/index.html
          cp -r docs/screenshots site/screenshots
          ls -lR site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  # A tag is also a release on GitHub: the package attached, the notes from
  # pkg-descr's section for this version -- so "0 releases" never again means
  # "nothing was released" (operator, 2026-10-09).
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: os-lens-feed
          path: feed
      - name: the version, and its notes from pkg-descr
        id: notes
        run: |
          version=$(sed -n 's/^PLUGIN_VERSION=[[:space:]]*//p' net-mgmt/lens/Makefile)
          revision=$(sed -n 's/^PLUGIN_REVISION=[[:space:]]*//p' net-mgmt/lens/Makefile)
          full="${version}${revision:+_$revision}"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          {
            awk -v v="$full" '$0 == v { on = 1; next } on && /^[0-9]+\.[0-9]+(_[0-9]+)?$/ { exit } on' \
              net-mgmt/lens/pkg-descr
            echo
            echo "**Install or update** as root on the firewall:"
            echo
            echo '```sh'
            echo 'fetch -o - https://raw.githubusercontent.com/BxnnyG/opnsense-lens/master/tools/install.sh | sh'
            echo '```'
            echo
            echo "The signed feed at https://bxnnyg.github.io/opnsense-lens/ serves this version; the package is attached below."
            echo "Every version's notes: [pkg-descr](https://github.com/BxnnyG/opnsense-lens/blob/${GITHUB_REF_NAME}/net-mgmt/lens/pkg-descr)."
          } > notes.md
          cat notes.md
      - name: the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" feed/All/*.pkg \
            --title "Lens ${{ steps.notes.outputs.full }}" --notes-file notes.md
